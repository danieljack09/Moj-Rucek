<!DOCTYPE html>
<html lang="mk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Мој Рачек – Админ</title>
<style>
  :root { --bg:#f6f7f4; --card:#fff; --ink:#1d2320; --muted:#667068; --line:#dfe3dc; --accent:#2e7d4f; --danger:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:12px 20px; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; flex:1; }
  main { max-width:960px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  button { font:inherit; border:1px solid var(--line); background:#fff; color:var(--ink); padding:8px 14px; border-radius:8px; cursor:pointer; }
  button:hover { background:#eef2ec; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#256a41; }
  button.danger { color:var(--danger); border-color:#e6c4c1; }
  button.tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  header button { background:transparent; color:#fff; border-color:#ffffff80; }
  input, select, textarea { font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  textarea { min-height:110px; resize:vertical; }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  .row > * { flex:1 1 140px; }
  .toolbar { display:flex; gap:10px; margin-bottom:12px; }
  .toolbar input { flex:1; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:middle; }
  th { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.04em; }
  td.actions { text-align:right; white-space:nowrap; }
  .line { display:grid; grid-template-columns:3fr 1fr 1.2fr 2fr auto; gap:8px; margin-bottom:8px; }
  @media (max-width:640px) { .line { grid-template-columns:1fr 1fr; } }
  .step-line { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .step-line .step-num { flex:none; min-width:70px; font-size:13px; color:var(--muted); }
  .step-line input { flex:1; }
  .msg { padding:10px 12px; border-radius:8px; margin-bottom:12px; }
  .msg.err { background:#fbeceb; color:var(--danger); }
  .msg.ok { background:#e8f3ec; color:var(--accent); }
  .muted { color:var(--muted); }
  #login { max-width:340px; margin:12vh auto; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<section id="login" class="card" hidden>
  <h2 style="margin-top:0">Админ најава</h2>
  <div id="login-err" class="msg err" hidden></div>
  <form id="login-form">
    <label for="pw">Лозинка</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <p><button class="primary" type="submit" style="width:100%">Најави се</button></p>
  </form>
</section>

<div id="app" hidden>
  <header>
    <h1>Мој Рачек – Админ</h1>
    <button id="logout">Одјави се</button>
  </header>
  <main>
    <div class="tabs">
      <button class="tab active" data-tab="ingredients">Намирници</button>
      <button class="tab" data-tab="recipes">Рецепти</button>
    </div>
    <div id="msg" class="msg" hidden></div>
    <div id="view"></div>
  </main>
</div>

<datalist id="ingredient-names"></datalist>

<script>
'use strict';

const $ = (sel) => document.querySelector(sel);
let meta = null;
let ingredients = [];
let tab = 'ingredients';

// Tiny DOM builder: children are always text nodes or elements (never HTML), so content can't inject markup.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  return el;
}

async function api(method, path, body) {
  const res = await fetch('/admin/api/' + path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && path !== 'login') { showLogin(); throw new Error(data.error || 'Не си најавен.'); }
  if (!res.ok) throw new Error(data.error || 'Грешка.');
  return data;
}

function flash(text, ok = true) {
  const m = $('#msg');
  m.textContent = text;
  m.className = 'msg ' + (ok ? 'ok' : 'err');
  m.hidden = false;
  clearTimeout(flash.t);
  flash.t = setTimeout(() => (m.hidden = true), 5000);
}

// ---------- login ----------

function showLogin() { $('#app').hidden = true; $('#login').hidden = false; }

$('#login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('#login-err');
  err.hidden = true;
  try {
    await api('POST', 'login', { password: $('#pw').value });
    $('#pw').value = '';
    await start();
  } catch (ex) { err.textContent = ex.message; err.hidden = false; }
});

$('#logout').addEventListener('click', async () => { await api('POST', 'logout').catch(() => {}); showLogin(); });

async function start() {
  meta = await api('GET', 'meta');
  await refreshIngredients();
  $('#login').hidden = true;
  $('#app').hidden = false;
  render();
}

async function refreshIngredients() {
  ingredients = await api('GET', 'ingredients');
  const dl = $('#ingredient-names');
  dl.replaceChildren(...ingredients.map((i) => h('option', { value: i.name })));
}

document.querySelectorAll('.tab').forEach((b) =>
  b.addEventListener('click', () => {
    tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach((x) => x.classList.toggle('active', x === b));
    render();
  })
);

function render() { (tab === 'ingredients' ? renderIngredients : renderRecipes)(); }

const select = (options, value, attrs = {}) =>
  h('select', attrs, Object.entries(options).map(([k, label]) => h('option', { value: k, selected: k === value }, label)));

// ---------- ingredients ----------

// Cyrillic/Latin-insensitive matching, so "pip" finds "пипер" and "sirenje"/"sirene" find "сирење".
const CYR = { а:'a',б:'b',в:'v',г:'g',д:'d',ѓ:'g',е:'e',ж:'z',з:'z',ѕ:'dz',и:'i',ј:'j',к:'k',л:'l',љ:'l',м:'m',н:'n',њ:'n',
  о:'o',п:'p',р:'r',с:'s',т:'t',ќ:'k',у:'u',ф:'f',х:'h',ц:'c',ч:'c',џ:'dz',ш:'s' };
const norm = (s) => [...s.trim().toLowerCase()].map((c) => CYR[c] ?? c).join('')
  .replace(/[čć]/g, 'c').replace(/š/g, 's').replace(/ž/g, 'z').replace(/đ/g, 'd');
const matches = (name, q) => { const n = norm(name), k = norm(q); return k && (n.includes(k) || (n.length >= 3 && k.includes(n))); };

let catFilter = '';

function renderIngredients(editing = null, filter = '') {
  const view = $('#view');
  const shown = ingredients.filter((i) => (!filter.trim() || matches(i.name, filter)) && (!catFilter || i.category === catFilter));

  const form = h('form', { class: 'card', onsubmit: async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = { name: f.name.value, category: f.category.value, defaultUnit: f.defaultUnit.value };
    try {
      await api(editing ? 'PUT' : 'POST', 'ingredients' + (editing ? '/' + editing.id : ''), body);
      flash(editing ? 'Намирницата е ажурирана.' : 'Намирницата е додадена.');
      await refreshIngredients();
      renderIngredients();
    } catch (ex) { flash(ex.message, false); }
  } },
    h('strong', {}, editing ? 'Уреди намирница' : 'Нова намирница'),
    h('div', { class: 'row' },
      h('div', {}, h('label', {}, 'Име'), h('input', { name: 'name', required: true, maxlength: 100, value: editing?.name ?? '', autocomplete: 'off', oninput: (e) => {
        const similar = e.target.value.trim()
          ? ingredients.filter((i) => i.id !== editing?.id && matches(i.name, e.target.value)).slice(0, 8) : [];
        const hint = $('#similar');
        hint.hidden = !similar.length;
        hint.textContent = similar.length
          ? 'Веќе постојат слични: ' + similar.map((i) => `${i.name} (${meta.units[i.defaultUnit] ?? i.defaultUnit})`).join(', ') : '';
      } }), h('div', { id: 'similar', class: 'msg err', hidden: true, style: 'margin:6px 0 0' })),
      h('div', {}, h('label', {}, 'Категорија'), select(meta.ingredientCategories, editing?.category ?? 'DRUGO', { name: 'category' })),
      h('div', {}, h('label', {}, 'Единица'), select(meta.units, editing?.defaultUnit ?? 'PIECE', { name: 'defaultUnit' }))),
    h('p', {}, h('button', { class: 'primary', type: 'submit' }, 'Зачувај'), ' ',
      editing && h('button', { type: 'button', onclick: () => renderIngredients() }, 'Откажи')));

  const search = h('input', { placeholder: 'Пребарај…', value: filter, oninput: (e) => {
    const pos = e.target.selectionStart;
    renderIngredients(editing, e.target.value);
    const n = $('#view input[placeholder]'); n.focus(); n.setSelectionRange(pos, pos);
  } });

  view.replaceChildren(form,
    h('div', { class: 'card' },
      h('div', { class: 'toolbar' }, search,
        select({ '': 'Сите категории', ...meta.ingredientCategories }, catFilter,
          { style: 'flex:0 0 200px; width:200px', onchange: (e) => { catFilter = e.target.value; renderIngredients(editing, filter); } }),
        h('span', { class: 'muted' }, `${shown.length} / ${ingredients.length}`)),
      h('table', {},
        h('tr', {}, h('th', {}, 'Име'), h('th', {}, 'Категорија'), h('th', {}, 'Единица'), h('th')),
        shown.map((i) => h('tr', {},
          h('td', {}, i.name),
          h('td', {}, meta.ingredientCategories[i.category] ?? i.category),
          h('td', {}, meta.units[i.defaultUnit] ?? i.defaultUnit),
          h('td', { class: 'actions' },
            h('button', { onclick: () => { renderIngredients(i, filter); window.scrollTo(0, 0); } }, 'Уреди'), ' ',
            h('button', { class: 'danger', onclick: async () => {
              if (!confirm(`Избриши „${i.name}“?`)) return;
              try { await api('DELETE', 'ingredients/' + i.id); await refreshIngredients(); renderIngredients(null, filter); flash('Избришано.'); }
              catch (ex) { flash(ex.message, false); }
            } }, 'Избриши')))))));
}

// ---------- recipes ----------

async function renderRecipes() {
  const recipes = await api('GET', 'recipes');
  $('#view').replaceChildren(
    h('div', { class: 'card' },
      h('div', { class: 'toolbar' }, h('button', { class: 'primary', onclick: () => renderRecipeForm(null) }, '+ Нов рецепт'),
        h('span', { class: 'muted' }, `${recipes.length} рецепти`)),
      h('table', {},
        h('tr', {}, h('th', {}, 'Име'), h('th', {}, 'Категорија'), h('th', {}, 'Порции'), h('th', {}, 'Состојки'), h('th')),
        recipes.map((r) => h('tr', {},
          h('td', {}, r.name),
          h('td', {}, meta.recipeCategories[r.category] ?? '—'),
          h('td', {}, r.servings),
          h('td', {}, r.ingredients.length),
          h('td', { class: 'actions' },
            h('button', { onclick: () => renderRecipeForm(r) }, 'Уреди'), ' ',
            h('button', { class: 'danger', onclick: async () => {
              if (!confirm(`Избриши „${r.name}“?`)) return;
              try { await api('DELETE', 'recipes/' + r.id); flash('Избришано.'); renderRecipes(); }
              catch (ex) { flash(ex.message, false); }
            } }, 'Избриши'))))))
  );
}

function renderRecipeForm(r) {
  const lines = h('div');
  const addLine = (l = {}) => {
    const row = h('div', { class: 'line' },
      h('input', { name: 'iname', list: 'ingredient-names', placeholder: 'Состојка', required: true, value: l.name ?? '' }),
      h('input', { name: 'iqty', type: 'number', step: 'any', min: '0', placeholder: 'Кол.', required: true, value: l.quantity ?? '' }),
      select(meta.units, l.unit ?? 'GRAM', { name: 'iunit' }),
      h('input', { name: 'inotes', placeholder: 'Белешка (опц.)', value: l.notes ?? '' }),
      h('button', { type: 'button', class: 'danger', onclick: () => row.remove() }, '✕'));
    lines.append(row);
  };
  (r?.ingredients?.length ? r.ingredients : [{}]).forEach(addLine);

  const steps = h('div');
  const renumberSteps = () => {
    [...steps.children].forEach((row, i) => { row.querySelector('.step-num').textContent = 'Чекор ' + (i + 1); });
  };
  const addStep = (text = '') => {
    const row = h('div', { class: 'step-line' },
      h('span', { class: 'step-num' }, ''),
      h('input', { name: 'step', placeholder: 'Опис на чекорот', value: text }),
      h('button', { type: 'button', class: 'danger', onclick: () => { row.remove(); renumberSteps(); } }, '✕'));
    steps.append(row);
    renumberSteps();
  };
  (r?.instructionSteps?.length ? r.instructionSteps : ['']).forEach(addStep);

  const catOptions = { '': '— без категорија —', ...meta.recipeCategories };

  const form = h('form', { class: 'card', onsubmit: async (e) => {
    e.preventDefault();
    const f = e.target;
    const body = {
      name: f.name.value,
      description: f.description.value,
      servings: f.servings.value,
      prepTimeMinutes: f.prep.value,
      cookTimeMinutes: f.cook.value,
      category: f.category.value,
      tags: f.tags.value.split(',').map((t) => t.trim()).filter(Boolean),
      instructionSteps: [...steps.children].map((row) => row.querySelector('[name=step]').value.trim()).filter(Boolean),
      notes: f.notes.value,
      ingredients: [...lines.children].map((row) => ({
        name: row.querySelector('[name=iname]').value,
        quantity: row.querySelector('[name=iqty]').value,
        unit: row.querySelector('[name=iunit]').value,
        notes: row.querySelector('[name=inotes]').value,
      })),
    };
    try {
      await api(r ? 'PUT' : 'POST', 'recipes' + (r ? '/' + r.id : ''), body);
      flash(r ? 'Рецептот е ажуриран.' : 'Рецептот е додаден.');
      renderRecipes();
    } catch (ex) { flash(ex.message, false); window.scrollTo(0, 0); }
  } },
    h('strong', {}, r ? 'Уреди рецепт' : 'Нов рецепт'),
    h('label', {}, 'Име'), h('input', { name: 'name', required: true, maxlength: 150, value: r?.name ?? '' }),
    h('label', {}, 'Опис'), h('input', { name: 'description', maxlength: 1000, value: r?.description ?? '' }),
    h('div', { class: 'row' },
      h('div', {}, h('label', {}, 'Категорија'), select(catOptions, r?.category ?? '', { name: 'category' })),
      h('div', {}, h('label', {}, 'Порции'), h('input', { name: 'servings', type: 'number', min: 1, max: 100, required: true, value: r?.servings ?? 4 })),
      h('div', {}, h('label', {}, 'Подготовка (мин)'), h('input', { name: 'prep', type: 'number', min: 0, required: true, value: r?.prepTimeMinutes ?? 0 })),
      h('div', {}, h('label', {}, 'Готвење (мин)'), h('input', { name: 'cook', type: 'number', min: 0, required: true, value: r?.cookTimeMinutes ?? 0 }))),
    h('label', {}, 'Тагови (одделени со запирка)'), h('input', { name: 'tags', value: (r?.tags ?? []).join(', ') }),
    h('label', {}, 'Состојки (за бројот на порции погоре)'), lines,
    h('button', { type: 'button', onclick: () => addLine() }, '+ Состојка'),
    h('label', {}, 'Чекори'), steps,
    h('button', { type: 'button', onclick: () => addStep() }, '+ Чекор'),
    h('label', {}, 'Белешки'), h('input', { name: 'notes', maxlength: 1000, value: r?.notes ?? '' }),
    h('p', {}, h('button', { class: 'primary', type: 'submit' }, 'Зачувај'), ' ',
      h('button', { type: 'button', onclick: renderRecipes }, 'Откажи')));

  $('#view').replaceChildren(form);
  window.scrollTo(0, 0);
}

// Try an existing session first.
api('GET', 'meta').then(start).catch(showLogin);
</script>
</body>
</html>
